<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player Online</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --primary-hover: #ff6b81;
            --bg-gradient: linear-gradient(135deg, #1e1e2f 0%, #2d2b42 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #ffffff;
            --text-muted: #a0a0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Reproductor Principal */
        .player-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .now-playing-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .radio-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            min-height: 2.5rem;
            background: linear-gradient(90deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease;
        }

        .radio-name.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Controles */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: var(--primary-hover);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* Lista de Radios */
        .radio-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .radio-item {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .radio-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,71,87,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .radio-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .radio-item:hover::before {
            opacity: 1;
        }

        .radio-item.active {
            border-color: var(--primary-color);
            background: rgba(255, 71, 87, 0.15);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.2);
        }

        .radio-item.active::after {
            content: '▶️ REPRODUCIENDO';
            display: block;
            font-size: 0.7rem;
            color: var(--primary-color);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .status-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 15px;
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .radio-name {
                font-size: 1.4rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 20px;
            }
            
            .volume-container {
                width: 100%;
                justify-content: center;
            }
            
            .volume-slider {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reproductor Principal -->
        <div class="player-card">
            <div class="now-playing-label">Escuchando ahora</div>
            <div class="radio-name" id="radioName">Selecciona una radio</div>
            
            <div class="controls">
                <button class="play-btn" id="playBtn" title="Reproducir / Pausar">
                    <!-- Icono Play -->
                    <svg id="iconPlay" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <!-- Icono Pause (oculto por defecto) -->
                    <svg id="iconPause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                
                <div class="volume-container">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                </div>
            </div>
            <div class="status-text" id="statusText"></div>
        </div>
<!-- Lista de Radios -->
        <div class="radio-list" id="radioList">
            <!-- Se genera dinámicamente con JavaScript -->
        </div>
    </div>

    <!-- Elemento de Audio Oculto -->
    <audio id="audioPlayer" preload="none"></audio>

    <script>
        // Configuración de las radios
        const radios = [
            { name: "VIEJAS ROMÁNTICAS", url: "https://stream.zeno.fm/urmfkad2em0uv" },
            { name: "FinLay Radio", url: "https://stream.zeno.fm/pb7ywd9xcp4uv" },
            { name: "Cumbias A Pleno", url: "https://stream.zeno.fm/1n6w364parzuv" },
            { name: "Henry Web", url: "https://stream.zeno.fm/73bvgeu2f78uv" },
            { name: "Cumbias y Rock Nacional", url: "https://stream.zeno.fm/jkodkmize49vv" },
            { name: "Latinos", url: "https://stream.zeno.fm/vw2af2mht68uv" }
        ];

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const radioNameDisplay = document.getElementById('radioName');
        const volumeSlider = document.getElementById('volumeSlider');
        const radioListContainer = document.getElementById('radioList');
        const statusText = document.getElementById('statusText');

        let currentRadioIndex = -1;
        let isPlaying = false;

        // Generar la lista de radios en el DOM
        radios.forEach((radio, index) => {
            const div = document.createElement('div');
            div.className = 'radio-item';
            div.textContent = radio.name;
            div.onclick = () => selectRadio(index);
            radioListContainer.appendChild(div);
        });

        // Función para seleccionar y reproducir una radio
        function selectRadio(index) {
            // Si se hace clic en la misma radio que ya está sonando, alternar play/pause
            if (currentRadioIndex === index) {
                togglePlay();
                return;
            }

            currentRadioIndex = index;
            const radio = radios[index];
            
            // Actualizar UI
            radioNameDisplay.textContent = radio.name;
            radioNameDisplay.classList.add('playing');
            statusText.textContent = "Conectando...";
            
            // Actualizar clases activas en la lista
            document.querySelectorAll('.radio-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Cargar y reproducir el nuevo stream (esto detiene automáticamente el anterior)
            audio.src = radio.url;
            audio.load();
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    updatePlayButton();
                    statusText.textContent = "En vivo";
                }).catch(error => {
                    console.error("Error al reproducir:", error);
                    statusText.textContent = "Error de conexión. Intenta de nuevo.";
                    isPlaying = false;
                    updatePlayButton();
                });
            }
        }

        // Alternar entre reproducir y pausar
        function togglePlay() {
            if (currentRadioIndex === -1) {
                selectRadio(0); // Si no hay nada seleccionado, empezar con la primera
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;

statusText.textContent = "Pausado";
                radioNameDisplay.classList.remove('playing');
            } else {
                audio.play();
                isPlaying = true;
                statusText.textContent = "En vivo";
                radioNameDisplay.classList.add('playing');
            }
            updatePlayButton();
        }

        // Actualizar el icono del botón
        function updatePlayButton() {
            if (isPlaying) {
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // Control de volumen
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Manejar errores de carga del audio
        audio.addEventListener('error', () => {
            statusText.textContent = "Stream no disponible temporalmente";
            isPlaying = false;
            updatePlayButton();
            radioNameDisplay.classList.remove('playing');
        });

        audio.addEventListener('waiting', () => {
            statusText.textContent = "Buffering...";
        });

        audio.addEventListener('playing', () => {
            statusText.textContent = "En vivo";
        });
    </script>
</body>
</html>
